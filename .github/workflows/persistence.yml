name: Persistence and adaptive loop
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_teacher_ai
          POSTGRES_USER: test_teacher
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Streamlit regression and failure tests
        run: python -m unittest discover -s tests -v
      - name: Real PostgreSQL persistence, migration and concurrent saves
        env:
          TEST_DATABASE_URL: postgresql://test_teacher:test_only_password@localhost:5432/test_teacher_ai
        run: python -m unittest discover -s tests -p test_persistence.py -v
